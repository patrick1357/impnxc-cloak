# impacket-opsec profile
# -----------------------
# Baked-in defaults used by impacket/_opsec.py after installation.
# Every value can be overridden per-run at runtime via an environment
# variable named IMPACKET_OPSEC_<KEY_IN_UPPERCASE>, e.g.:
#   IMPACKET_OPSEC_WORKSTATION=FIN-WKS042 impacket-secretsdump ...
#
# The goal is to make the client blend into normal Windows 10/11 domain
# traffic. Pick values that are plausible for the target environment.

[opsec]
# NetBIOS / NTLM-Workstation name presented to the target.
# Leave empty to auto-generate a random DESKTOP-XXXXXXX once per process.
# For a pivot, a name matching the client's naming scheme is ideal.
workstation =

# NTLM VERSION block (leaks the "OS build" in NTLM Negotiate/Authenticate).
# Windows 11 keeps major.minor = 10.0 (NT kernel is still 10.0); only the build
# distinguishes it from Windows 10. 26100 = Windows 11 24H2 (current mainstream).
# Other Win11 builds: 22000 (21H2), 22621 (22H2), 22631 (23H2).
ntlm_major = 10
ntlm_minor = 0
ntlm_build = 26100

# SMB1 SessionSetup Native OS / LanMan strings.
# Only relevant if SMB1 is spoken at all (a real Win11 client would not).
# Kept consistent with the NTLM version above so the fingerprint isn't mixed.
native_os = Windows 11 Enterprise 26100
native_lanman = Windows 11 Enterprise 10.0

# SMB2/3 client Capabilities bitmask sent in the (multi-dialect) NEGOTIATE.
# 0x47 = DFS | LEASING | LARGE_MTU | ENCRYPTION.
# WARNING: do NOT set the DIRECTORY_LEASING bit (0x20). A/B tested against
# Server 2022: with 0x20 the server reports SupportsDirectoryLeasing and impacket
# runs into an UnboundLocalError ('parentDir') on EVERY file/dir create at a share
# root -- i.e. --shares write-check, put_file and exec output all crash AFTER a
# successful login. All other bits (0x01/0x02/0x04/0x08/0x10) are safe.
smb2_capabilities = 0x47

# --- Enum-script pacing (affects lookupsid / RID cycling) ---
# RID lookups per SAMR/LSAR call. impacket default is 1000 (a loud burst that
# lights up 4661/4662 mass-lookup analytics). Smaller = quieter but more calls.
rid_batch = 250
# Jittered pause (milliseconds) between RID batches. Set pace_ms_max = 0 to disable.
pace_ms_min = 150
pace_ms_max = 600

# --- Exec output artefacts (impacket wmiexec / smbexec CLI tools) ---
# Command output is captured to a temp file on ADMIN$/C$. Stock impacket names
# it with a static tell -- '__<epoch>' (wmiexec) and '__output_<rand>'
# (smbexec) -- both matched by public Sigma/Defender rules. We drop the '__'
# prefix and use a plausible %TEMP%-style name; this sets its extension.
exec_output_ext = .tmp
# smbexec spins up a transient service (Event 7045). Empty = random alnum name.
# Set a fixed, environment-plausible service name to blend the service-install.
exec_service_name =

# Shell wrapper nxc's wmiexec prepends to a remote command (obf/nxc_obf only).
# Stock 'cmd.exe /Q /c ' under wmiprvse.exe is the WIN-EXE-PRC-IMPACKET-WMIEXEC
# signature shape. This ONLY changes the command line -- it does NOT change the
# wmiprvse->cmd parent-child that behavioural EDR keys on. Default is unchanged;
# experiment per-run, e.g.:
#   IMPACKET_OPSEC_EXEC_SHELL_PREFIX='cmd.exe /c '
#   IMPACKET_OPSEC_EXEC_SHELL_PREFIX='cmd.exe /c ping -n 4 127.0.0.1 >nul & '
# Combine with nxc's --no-output to also drop the '1> ...\Temp\... 2>&1' redirect.
exec_shell_prefix = cmd.exe /Q /c

# Output redirect style for nxc's wmiexec (obf only). Stock impacket emits
# '1> <file> 2>&1'; the explicit '1>' + '/Q /c' is what Sophos'
# WIN-EXE-PRC-IMPACKET-WMIEXEC matched. goexec uses a plain '> <file> 2>&1' and
# slips that rule WITH output. Empty/'stock' = '1>' (unchanged); 'goexec' = '>'.
#   IMPACKET_OPSEC_EXEC_REDIRECT_STYLE=goexec
exec_redirect_style =

# --- MSSQL / TDS handshake tells (impacket wire layer, always on) ---
# These normalise constant bytes in impacket's TDS handshake that fingerprint
# the client regardless of the workstation name. None carry credentials; the
# server ignores or only echoes them, so they are functionally safe.
#
# Login7 ClientPID: impacket ships random.randint(0,1024) -- implausibly low
# (real user PIDs are in the thousands; Windows PIDs are multiples of 4). A
# random multiple of 4 is drawn from [min, max).
tds_client_pid_min = 1000
tds_client_pid_max = 40000
# PreLogin VERSION token: impacket hardcodes the literal 08 00 01 55 00 00 in
# every handshake. Encoded here as 'major.minor.build'. The server does NOT
# validate it (it echoes its own version back), so any plausible value works.
# NOTE: 16.0.1000 is a best-effort placeholder that reads as a SQL-2022-era
# client -- for the tightest blend, set this to a value captured from a real
# SqlClient/ODBC/OLE-DB driver in the target environment.
tds_prelogin_version = 16.0.1000
# Login7 requested packet size (and impacket's internal fragmentation size).
# impacket uses 32763, or 16383 once TLS is set up (nxc's mssql path). Real SSMS
# defaults to 4096; SQL Server dictates the effective size via ENVCHANGE anyway,
# so smaller just means slightly more fragmentation.
tds_packet_size = 4096
